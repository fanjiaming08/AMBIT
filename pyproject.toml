[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ambit-topopt"
version = "1.0.0"
description = "Curvature-informed adaptive moment estimation in a Fermi-Dirac Bregman mirror step for topology optimization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["ambit*"]
